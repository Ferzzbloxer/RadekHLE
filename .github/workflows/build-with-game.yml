name: Build RadekHLE with bundled game

on:
  workflow_dispatch: {}
  push:
    branches: [ "trunk" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sanity-check game asset is present
        run: |
          if [ ! -f "game_asset/game.ipa" ]; then
            echo "::error::game_asset/game.ipa is missing. Add your .ipa there before running this workflow."
            exit 1
          fi
          ls -lh game_asset/game.ipa

      - name: Copy game into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp game_asset/game.ipa android/app/src/main/assets/game.ipa

      - name: Ensure .ipa is not re-compressed by aapt
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ] && ! grep -q 'noCompress "ipa"' "$GRADLE_FILE"; then
            python3 patches/add_no_compress.py "$GRADLE_FILE"
          fi

      - name: Patch MainActivity to seed the bundled game on first launch
        run: |
          python3 patches/seed_bundled_app.py \
            android/app/src/main/java/org/radekhle/android/MainActivity.java

      - name: Download Boost headers
        run: |
          curl -sSL -o boost.tar.gz "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"
          mkdir -p vendor/boost
          tar -xzf boost.tar.gz -C vendor/boost --strip-components=1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk@3.5.4

      - name: Download Android NDK
        run: curl -L -o android-ndk-r25c-linux.zip "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip"

      - name: Extract Android NDK
        run: 7z -oandroid-ndk -snld x android-ndk-r25c-linux.zip

      - name: Link Android NDK into the SDK's managed location
        run: ln -s "$PWD/android-ndk/android-ndk-r25c" "$ANDROID_SDK_ROOT/ndk/25.2.9519653"

      - name: Download CMake
        run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz"

      - name: Extract CMake
        run: |
          mkdir -p vendor
          tar xzf "cmake-3.31.6-linux-x86_64.tar.gz" -C vendor
          mv vendor/cmake-3.31.6-linux-x86_64 vendor/cmake

      - name: Install standalone Gradle
        run: |
          curl -sSL -o gradle.zip "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
          unzip -q gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build APK
        env:
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          cd android
          gradle assembleRelease --stacktrace
          mv app/build/outputs/apk/release/*.apk ../RadekHLE-with-game.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: radekhle-with-game
          path: RadekHLE-with-game.apk
